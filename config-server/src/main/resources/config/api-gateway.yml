server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Idempotency-Key
              - X-Correlation-Id
            exposedHeaders:
              - X-Correlation-Id
              - Idempotency-Key
            allowCredentials: true
            maxAge: 3600

      # Applied to every route: 10 requests/sec per IP, bursts up to 20
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**,/api/v1/kyc/**

        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/v1/accounts/**

        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/v1/transactions/**

        - id: loan-service
          uri: lb://loan-service
          predicates:
            - Path=/api/v1/loans/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**